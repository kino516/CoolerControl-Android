name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug & release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 防御性处理：仓库在 Windows 上维护，gradlew 的可执行位有可能丢失
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 项目要求 compileSdk 37 + Build Tools 37.0.0，runner 预装版本通常落后
      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # CI 环境没有签名配置，release 会回退到 debug 签名——
      # 这里只用来验证 Kotlin 编译、R8 与资源压缩能通过，产物不作为发布包
      - name: Assemble
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CoolerControl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
