name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug and release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 防御性处理：仓库在 Windows 上维护，gradlew 的可执行位有可能丢失
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 已预装 Android SDK（含 cmdline-tools），这里只补装项目需要的
      # API 37 与 Build Tools 37.0.0。
      # 不使用 android-actions/setup-android：该 action 仍停留在 Node.js 20 时代，
      # 在 runner 上被强制跑在 Node 24 下会直接失败（见 run #1）。
      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::未找到预装 Android SDK：$SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::在 $SDK_ROOT 下未找到 sdkmanager"
            exit 1
          fi
          echo "使用 sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0"

          echo "--- 已安装的 platforms / build-tools ---"
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # CI 环境没有签名配置，release 会回退到 debug 签名——
      # 这里只用来验证 Kotlin 编译、R8 与资源压缩能通过，产物不作为发布包
      - name: Assemble
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CoolerControl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
