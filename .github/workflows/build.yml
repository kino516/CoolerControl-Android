name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug and release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 防御性处理：仓库在 Windows 上维护，gradlew 的可执行位有可能丢失
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 预装的 Android SDK 已包含本项目需要的
      # platforms/android-37.0 与 build-tools/37.0.0，正常情况下无需安装；
      # 万一将来 runner 镜像变动，这里按需补装。
      # 不使用 android-actions/setup-android：该 action 仍面向 Node.js 20，
      # 在 runner 上被强制跑在 Node 24 下会直接失败。
      - name: Locate Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error title=Android SDK 缺失::$SDK_ROOT 不存在"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "::notice title=platforms::$(ls "$SDK_ROOT/platforms" | tr '\n' ' ')"
          echo "::notice title=build-tools::$(ls "$SDK_ROOT/build-tools" | tr '\n' ' ')"

          # 注意：官方 API 37 的目录名带 minor（android-37.0），没有裸的 android-37
          if ! ls -d "$SDK_ROOT"/platforms/android-37* > /dev/null 2>&1; then
            echo "::warning title=缺少 API 37 平台::尝试补装 platforms;android-37.0"
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            if ! "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"; then
              echo "::error title=SDK 补装失败::可用平台为 $(yes | "$SDKMANAGER" --list 2>/dev/null | grep -oE 'platforms;android-3[0-9.]+' | sort -u | tail -8 | tr '\n' ' ')"
              exit 1
            fi
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # CI 环境没有签名配置，release 会回退到 debug 签名——
      # 这里只用来验证 Kotlin 编译、R8 与资源压缩能通过，产物不作为发布包
      - name: Assemble
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CoolerControl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
